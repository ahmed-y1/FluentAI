<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FluentAI - Page not found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: light; font-family: Inter, sans-serif; background: #F8FAFC; color: #0F172A; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main { display: flex; flex-direction: column; min-height: 100vh; padding: 32px 7vw 48px; }
      .brand { align-items: center; display: flex; font-size: 19px; font-weight: 700; gap: 9px; letter-spacing: -1px; }
      .dot { background: #6366F1; border-radius: 50%; height: 10px; width: 10px; }
      .content { margin: auto 0; max-width: 620px; }
      .eyebrow { color: #64748B; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
      .live { background: #6366F1; border-radius: 50%; display: inline-block; height: 7px; margin-right: 8px; width: 7px; }
      h1 { font-family: "Plus Jakarta Sans", sans-serif; font-size: clamp(54px, 9vw, 110px); font-weight: 600; letter-spacing: -8px; line-height: .9; margin: 22px 0; }
      em { color: #6366F1; font-family: "Plus Jakarta Sans", sans-serif; font-weight: 600; letter-spacing: -5px; }
      p { color: #475569; font-size: 17px; line-height: 1.6; max-width: 410px; }
      .actions { align-items: center; display: flex; flex-wrap: wrap; gap: 24px; margin-top: 32px; }
      a { color: #0F172A; font-size: 13px; font-weight: 700; text-decoration: none; }
      .button { background: #6366F1; border-radius: 99px; color: white; padding: 16px 21px; }
      .button:hover { background: #4F46E5; }
      .code { color: #94A3B8; font-size: 10px; letter-spacing: 2px; margin-top: auto; }
    </style>
    <script>
      const path = window.location.pathname;
      const segments = path.split('/').filter(Boolean);
      const base = segments.length > 1 ? '/' + segments[0] : '';
    </script>
  </head>
  <body>
    <main>
      <div class="brand"><span class="dot"></span>FluentAI</div>
      <section class="content">
        <div class="eyebrow"><span class="live"></span>Signal lost</div>
        <h1>This page missed<br><em>the cue.</em></h1>
        <p>The page you were looking for is not part of this session. Let&apos;s get you back somewhere useful.</p>
        <div class="actions">
          <a class="button" id="home-link" href="/">Back home -&gt;</a>
          <a id="session-link" href="/session/">Start a session &#8594;</a>
        </div>
      </section>
      <span class="code">404 / FLUENTAI</span>
    </main>
    <script>
      document.getElementById('home-link').href = base + '/';
      document.getElementById('session-link').href = base + '/session/';
    </script>
  </body>
</html>
