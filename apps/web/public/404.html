<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fluent AI</title>
    <script>
      const path = window.location.pathname;
      const base = path.split('/').slice(0, 2).join('/') || '';
      const target = base + '/';
      if (path !== target) window.location.replace(target);
    </script>
  </head>
  <body>
    <p>Loading Fluent AI...</p>
  </body>
</html>
